<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Store 212 Orientation</title>
  <link rel="stylesheet" href="orientation.css">
</head>
<body>
  <main class="orientation-viewer" aria-label="Pet Supplies Plus Store 212 orientation">
    <section class="slide-stage" aria-label="Orientation slide">
      <img
        id="slide-image"
        src="slides/09142026/slide-01.png"
        width="1920"
        height="1080"
        alt="Orientation slide 1 of 54"
        fetchpriority="high"
        decoding="async"
      >
    </section>

    <nav class="slide-navigation" aria-label="Slide navigation">
      <button id="back-button" type="button" aria-keyshortcuts="ArrowLeft" disabled>Back</button>
      <button id="forward-button" type="button" aria-keyshortcuts="ArrowRight">Forward</button>
    </nav>

    <p id="slide-status" class="visually-hidden" aria-live="polite">Slide 1 of 54</p>
  </main>

  <script src="orientation.js" defer></script>
</body>
</html>
