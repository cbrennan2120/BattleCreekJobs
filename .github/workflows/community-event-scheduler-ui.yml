name: Community event scheduler UI

on:
  push:
    paths:
      - "community-event-scheduler/**"
      - ".github/workflows/community-event-scheduler-ui.yml"
  pull_request:
    paths:
      - "community-event-scheduler/**"
      - ".github/workflows/community-event-scheduler-ui.yml"

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: community-event-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: community-event-scheduler/package-lock.json
      - run: npm ci
      - run: npx playwright install
      - run: npm run check
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: community-event-scheduler/playwright-report
          retention-days: 14
